apiVersion: v1
kind: Service
metadata:
  name: {{ include "fitness-plan-service.fullname" .}}
  labels:
    {{- include "fitness-plan-service.labels" . | nindent 4}}
spec:
  type: {{ .Values.service.type}}
  ports:
    - port: {{ .Values.service.port}}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.grpcPort}}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "fitness-plan-service.selectorLabels" . | nindent 4}}
