{{- if .Values.istio.enabled}}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "fitness-plan-service.fullname" . }}-mtls
  labels:
    {{- include "fitness-plan-service.labels" . | nindent 4}}
spec:
  selector:
    matchLabels:
      {{- include "fitness-plan-service.selectorLabels" . | nindent 6}}
  mtls:
    mode: {{ .Values.istio.mtls.mode | default "STRICT"}}
  {{- end}}
